<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>有你的一份礼物，请查收</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            font-family: Arial, sans-serif;
            padding: 15px;
            overflow-x: hidden;
            will-change: transform;
            transform: translateZ(0);
        }

        .top-text {
            font-size: clamp(18px, 5vw, 26px);
            color: #ff4081;
            margin-bottom: 30px;
            font-weight: bold;
            text-align: center;
            line-height: 1.3;
        }

        .gift-container {
            text-align: center;
            padding: 30px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 380px;
        }

        .gift-icon {
            font-size: 70px;
            color: #ff5722;
            margin-bottom: 25px;
        }

        .receive-btn {
            padding: 14px 35px;
            font-size: 18px;
            background: linear-gradient(45deg, #ff4081, #ff9800);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            width: 100%;
            will-change: transform;
            transform: translateZ(0);
            transition: opacity 0.2s;
            cursor: pointer;
        }

        /* 加载中状态 */
        .receive-btn.loading {
            background: #999;
            cursor: not-allowed;
            animation: none;
        }

        .jump {
            animation: jump 0.35s infinite alternate;
        }

        @keyframes jump {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        .surprise {
            display: none;
            text-align: center;
            width: 100%;
        }

        .surprise-img {
            width: 100%;
            max-width: 380px;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 15px;
            will-change: opacity;
        }

        .gift-container, .receive-btn, .surprise-img {
            transform: translateZ(0);
            backface-visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="top-text">✨ 专属惊喜已送达，快来领取吧 ✨</div>

    <div class="gift-container" id="giftBox">
        <div class="gift-icon"><i class="fas fa-gift"></i></div>
        <button class="receive-btn jump" id="receiveBtn">点击领取礼物</button>
    </div>

    <div class="surprise" id="surpriseContent">
        <img id="giftImg" src="" alt="惊喜" class="surprise-img">
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    

    <script>
        const btn = document.getElementById('receiveBtn');
        const gift = document.getElementById('giftBox');
        const content = document.getElementById('surpriseContent');
        const music = document.getElementById('bgMusic');
        const img = document.getElementById('giftImg');

        // 资源地址
        const IMG_SRC = "image.png";
        let resourceReady = false;

        // 音乐循环兜底
        music.onended = () => {
            music.currentTime = 0;
            music.play().catch(()=>{});
        };

        // 预加载图片
        const preloadImg = new Image();
        preloadImg.src = IMG_SRC;

        // 全部资源加载完成
        function checkAllReady() {
            if (preloadImg.complete && music.readyState >= 3) {
                resourceReady = true;
                img.src = IMG_SRC;
                btn.textContent = "点击领取礼物";
                btn.classList.remove('loading');
                btn.classList.add('jump');
            }
        }

        // 监听图片/音频加载
        preloadImg.onload = checkAllReady;
        music.addEventListener('canplaythrough', checkAllReady);

        // 点击事件
        btn.onclick = () => {
            // 未加载完成：提示 + 拦截操作
            if (!resourceReady) {
                btn.textContent = "正在打开礼物…";
                btn.classList.add('loading');
                btn.classList.remove('jump');
                return;
            }

            // 资源就绪：执行震动、切换、播放音乐
            if (navigator.vibrate) {
                navigator.vibrate([50,30,50,30,100]);
            }
            gift.style.display = 'none';
            content.style.display = 'block';
            music.play().catch(()=>{});
        };
    </script>
</body>
</html>
